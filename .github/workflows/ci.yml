
name: CI - Loja Facil

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Verificar sintaxe do codigo
        run: python -m compileall -q src tests

      - name: Executar testes e cobertura
        run: python -m pytest tests -v --cov=src --cov-report=term --cov-fail-under=70

      - name: Analisar codigo com Flake8
        run: python -m flake8 src tests --select=E9,F63,F7,F82

      - name: Criar artefato versionado
        run: |
          mkdir -p dist
          zip -r "dist/loja-facil-${GITHUB_SHA:0:7}.zip" src requirements.txt README.md

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: loja-facil-${{ github.sha }}
          path: dist/*.zip
