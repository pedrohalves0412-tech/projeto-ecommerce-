apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-facil
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loja-facil
  template:
    metadata:
      labels:
        app: loja-facil
    spec:
      containers:
        - name: loja-facil
          image: loja-facil:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: development
          readinessProbe:
            httpGet:
              path: /
              port: 5000
          livenessProbe:
            httpGet:
              path: /
              port: 5000